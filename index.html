<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Pong Game with Score</title>
  <style>
    body {
      background: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
    }
    h1 {
      margin-top: 30px;
      font-size: 2rem;
      letter-spacing: 2px;
    }
    #scoreboard {
      font-size: 2rem;
      margin-top: 20px;
      margin-bottom: 10px;
      letter-spacing: 3px;
      font-family: monospace;
    }
    #pong {
      background: #000;
      display: block;
      margin: 20px auto 40px auto;
      border: 5px solid #fff;
      border-radius: 10px;
      outline: 4px solid #0ff;
      outline-offset: 8px;
      box-shadow: 0 0 20px #0ff, 0 0 40px #444;
    }
  </style>
</head>
<body>
  <h1>Simple Pong Game</h1>
  <div id="scoreboard">0 : 0</div>
  <canvas id="pong" width="800" height="500"></canvas>
  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    const scoreboard = document.getElementById('scoreboard');

    const PADDLE_WIDTH = 15, PADDLE_HEIGHT = 100;
    const BALL_RADIUS = 12;
    const PLAYER_X = 30, AI_X = canvas.width - 30 - PADDLE_WIDTH;

    let playerY = (canvas.height - PADDLE_HEIGHT) / 2;
    let aiY = (canvas.height - PADDLE_HEIGHT) / 2;
    let ballX = canvas.width / 2, ballY = canvas.height / 2;
    let ballSpeedX = 3, ballSpeedY = 2; // Lower speed
    let playerScore = 0, aiScore = 0;

    canvas.addEventListener('mousemove', function(e) {
      const rect = canvas.getBoundingClientRect();
      const y = e.clientY - rect.top;
      playerY = y - PADDLE_HEIGHT / 2;
      // Clamp
      playerY = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, playerY));
    });

    function drawNet() {
      ctx.fillStyle = "#ccc";
      for(let y = 0; y < canvas.height; y += 24 + 18) {
        ctx.fillRect(canvas.width/2 - 2, y, 4, 24);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawNet();

      ctx.fillStyle = "#fff";
      ctx.fillRect(PLAYER_X, playerY, PADDLE_WIDTH, PADDLE_HEIGHT);

      ctx.fillRect(AI_X, aiY, PADDLE_WIDTH, PADDLE_HEIGHT);

      ctx.beginPath();
      ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = "#0f0";
      ctx.fill();
    }

    function resetBall(scoredBy) {
      ballX = canvas.width/2;
      ballY = canvas.height/2;
      ballSpeedX = (scoredBy === "player" ? 1 : -1) * 3;
      ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * 2;
    }

    function update() {
      ballX += ballSpeedX;
      ballY += ballSpeedY;

      if (ballY - BALL_RADIUS < 0 && ballSpeedY < 0) {
        ballY = BALL_RADIUS;
        ballSpeedY *= -1;
      }
      if (ballY + BALL_RADIUS > canvas.height && ballSpeedY > 0) {
        ballY = canvas.height - BALL_RADIUS;
        ballSpeedY *= -1;
      }

      if (
        ballX - BALL_RADIUS < PLAYER_X + PADDLE_WIDTH &&
        ballX - BALL_RADIUS > PLAYER_X &&
        ballY > playerY &&
        ballY < playerY + PADDLE_HEIGHT &&
        ballSpeedX < 0
      ) {
        ballX = PLAYER_X + PADDLE_WIDTH + BALL_RADIUS;
        ballSpeedX *= -1;
        let deltaY = ballY - (playerY + PADDLE_HEIGHT / 2);
        ballSpeedY = deltaY * 0.18;
      }

      if (
        ballX + BALL_RADIUS > AI_X &&
        ballX + BALL_RADIUS < AI_X + PADDLE_WIDTH + 2 &&
        ballY > aiY &&
        ballY < aiY + PADDLE_HEIGHT &&
        ballSpeedX > 0
      ) {
        ballX = AI_X - BALL_RADIUS;
        ballSpeedX *= -1;
        let deltaY = ballY - (aiY + PADDLE_HEIGHT / 2);
        ballSpeedY = deltaY * 0.18;
      }

      if (ballX - BALL_RADIUS < 0) {
        aiScore++;
        updateScoreboard();
        resetBall("ai");
      }

      if (ballX + BALL_RADIUS > canvas.width) {
        playerScore++;
        updateScoreboard();
        resetBall("player");
      }

      const aiCenter = aiY + PADDLE_HEIGHT / 2;
      if (aiCenter < ballY - 10) {
        aiY += 5;
      } else if (aiCenter > ballY + 10) {
        aiY -= 5;
      }
      aiY = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, aiY));
    }

    function updateScoreboard() {
      scoreboard.textContent = playerScore + " : " + aiScore;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function init() {
      playerScore = 0;
      aiScore = 0;
      updateScoreboard();
      resetBall("player");
      gameLoop();
    }

    init();
  </script>
</body>
</html>
