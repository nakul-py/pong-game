<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Pong Game</title>
    <style>
      body {
        background: #222;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Arial, sans-serif;
        margin: 0;
        height: 100vh;
      }
      h1 {
        margin-top: 30px;
        font-size: 2rem;
        letter-spacing: 2px;
      }
      #scoreboard {
        font-size: 2rem;
        margin-top: 20px;
        margin-bottom: 10px;
        letter-spacing: 3px;
        font-family: monospace;
      }
      #pong {
        background: #000;
        display: block;
        margin: 20px auto 40px auto;
        border: 5px solid #fff;
        border-radius: 10px;
        outline: 4px solid #0ff;
        outline-offset: 8px;
        box-shadow: 0 0 20px #0ff, 0 0 40px #444;
      }
      #endgame {
        margin-top: 20px;
      }
      #endgame h2 {
        font-size: 1.5rem;
        color: #0ff;
      }
      #startgame {
        margin-top: 20px;
      }
      #startgame h2 {
        font-size: 1.5rem;
        color: #0ff;
      }
      button {
        background: #0ff;
        border: none;
        border-radius: 5px;
        color: #000;
        cursor: pointer;
        transition: 0.2s ease;
      }
      button:hover {
        background: #0cc;
      }
      #countdown {
        font-weight: bold;
        text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      }
    </style>
  </head>
  <body>
    <h1>Simple Pong Game</h1>
    <div id="scoreboard">0 : 0</div>
    <canvas id="pong" width="800" height="500"></canvas>
    <div id="startScreen" style="text-align: center; margin-top: 20px">
      <button onclick="startGame()" style="padding: 10px 20px; font-size: 1rem">
        Start
      </button>
    </div>
    <div id="endgame" style="display: none; text-align: center">
      <h2 id="endMessage"></h2>
      <button
        onclick="restartGame()"
        style="padding: 10px 20px; font-size: 1rem"
      >
        Restart
      </button>
    </div>
    <div
      id="countdown"
      style="display: none; font-size: 3rem; color: #0ff; margin-top: 20px"
    >
      3
    </div>
    <script>
      const canvas = document.getElementById("pong");
      const ctx = canvas.getContext("2d");
      const scoreboard = document.getElementById("scoreboard");
      const countdownDiv = document.getElementById("countdown");

      const PADDLE_WIDTH = 15,
        PADDLE_HEIGHT = 100;
      const BALL_RADIUS = 12;
      const PLAYER_X = 30,
        AI_X = canvas.width - 30 - PADDLE_WIDTH;

      let gameOver = false;
      let playerName = "Player";
      const endgameDiv = document.getElementById("endgame");
      const endMessage = document.getElementById("endMessage");

      let playerY = (canvas.height - PADDLE_HEIGHT) / 2;
      let aiY = (canvas.height - PADDLE_HEIGHT) / 2;
      let ballX = canvas.width / 2,
        ballY = canvas.height / 2;
      let ballSpeedX = 3,
        ballSpeedY = 2; // Lower speed
      let playerScore = 0,
        aiScore = 0;

      canvas.addEventListener("mousemove", function (e) {
        const rect = canvas.getBoundingClientRect();
        const y = e.clientY - rect.top;
        playerY = y - PADDLE_HEIGHT / 2;
        playerY = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, playerY));
      });

      function drawNet() {
        if (!ctx || !canvas) {
          throw new Error("Canvas or context is null");
        }
        ctx.fillStyle = "#ccc";
        for (let y = 0; y < canvas.height; y += 24 + 18) {
          ctx.fillRect(canvas.width / 2 - 2, y, 4, 24);
        }
      }

      function draw() {
        if (!ctx || !canvas) {
          throw new Error("Canvas or context is null");
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawNet();

        ctx.fillStyle = "#fff";
        ctx.fillRect(PLAYER_X, playerY, PADDLE_WIDTH, PADDLE_HEIGHT);

        ctx.fillRect(AI_X, aiY, PADDLE_WIDTH, PADDLE_HEIGHT);

        ctx.beginPath();
        ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = "#0f0";
        ctx.fill();
      }

      function resetBall(scoredBy) {
        if (!canvas || !ctx) {
          throw new Error("Canvas or context is null");
        }
        ballX = canvas.width / 2;
        ballY = canvas.height / 2;
        ballSpeedX = (scoredBy === "player" ? 1 : -1) * 3;
        ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * 2;
      }

      function update() {
        if (
          !canvas ||
          !ctx ||
          typeof ballX === "undefined" ||
          typeof ballY === "undefined"
        ) {
          throw new Error("Canvas, context, or ball position is undefined");
        }

        ballX += ballSpeedX;
        ballY += ballSpeedY;

        if (ballY - BALL_RADIUS < 0 && ballSpeedY < 0) {
          ballY = BALL_RADIUS;
          ballSpeedY *= -1;
        }
        if (ballY + BALL_RADIUS > canvas.height && ballSpeedY > 0) {
          ballY = canvas.height - BALL_RADIUS;
          ballSpeedY *= -1;
        }

        if (
          ballX - BALL_RADIUS < PLAYER_X + PADDLE_WIDTH &&
          ballX - BALL_RADIUS > PLAYER_X &&
          ballY > playerY &&
          ballY < playerY + PADDLE_HEIGHT &&
          ballSpeedX < 0
        ) {
          ballX = PLAYER_X + PADDLE_WIDTH + BALL_RADIUS;
          ballSpeedX *= -1;
          const deltaY = ballY - (playerY + PADDLE_HEIGHT / 2);
          ballSpeedY = deltaY * 0.18;
        }

        if (
          ballX + BALL_RADIUS > AI_X &&
          ballX + BALL_RADIUS < AI_X + PADDLE_WIDTH + 2 &&
          ballY > aiY &&
          ballY < aiY + PADDLE_HEIGHT &&
          ballSpeedX > 0
        ) {
          ballX = AI_X - BALL_RADIUS;
          ballSpeedX *= -1;
          const deltaY = ballY - (aiY + PADDLE_HEIGHT / 2);
          ballSpeedY = deltaY * 0.18;
        }

        if (ballX - BALL_RADIUS < 0) {
          aiScore++;
          updateScoreboard();
          resetBall("ai");
        }

        if (ballX + BALL_RADIUS > canvas.width) {
          playerScore++;
          updateScoreboard();
          resetBall("player");
        }

        const aiCenter = aiY + PADDLE_HEIGHT / 2;
        if (aiCenter < ballY - 10) {
          aiY += 5;
        } else if (aiCenter > ballY + 10) {
          aiY -= 5;
        }
        aiY = Math.max(0, Math.min(canvas.height - PADDLE_HEIGHT, aiY));
      }

      function updateScoreboard() {
        if (!scoreboard) return;

        scoreboard.textContent =
          playerName + " " + playerScore + " : " + aiScore + " AI";

        if (playerScore >= 10 || aiScore >= 10) {
          gameOver = true;
          const winner = playerScore >= 10 ? "You win! 🎉" : "AI wins! 😢";
          endMessage.textContent = winner;
          endgameDiv.style.display = "block";
        }
      }

      function gameLoop() {
        if (gameOver) return;
        try {
          update();
          draw();
          requestAnimationFrame(gameLoop);
        } catch (error) {
          if (error instanceof TypeError) {
            console.error("TypeError: ", error.message);
          } else if (error instanceof ReferenceError) {
            console.error("ReferenceError: ", error.message);
          } else {
            console.error("Error: ", error.message);
          }
        }
      }

      function startGame() {
        const name = prompt("Enter your name:");
        if (name) playerName = name;

        document.getElementById("startScreen").style.display = "none";
        startCountdown();
      }

      function restartGame() {
        playerScore = 0;
        aiScore = 0;
        gameOver = false;
        endgameDiv.style.display = "none";
        scoreboard.textContent = "0 : 0";
        startCountdown();
      }

      function startCountdown() {
        let count = 3;
        countdownDiv.textContent = count;
        countdownDiv.style.display = "block";

        const interval = setInterval(() => {
          count--;
          if (count > 0) {
            countdownDiv.textContent = count;
          } else if (count === 0) {
            countdownDiv.textContent = "Go!";
          } else {
            clearInterval(interval);
            countdownDiv.style.display = "none";
            resetBall("player");
            requestAnimationFrame(gameLoop);
          }
        }, 1000);
      }

      function initSetup() {
        if (!canvas || !ctx || !scoreboard) {
          throw new Error("Canvas, context, or scoreboard is null");
        }

        playerScore = 0;
        aiScore = 0;

        updateScoreboard();

        resetBall("player");

        gameLoop();
      }
    </script>
  </body>
</html>
